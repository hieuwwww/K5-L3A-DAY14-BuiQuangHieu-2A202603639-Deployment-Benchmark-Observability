services:
  agent:
    build: .
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      PORT: "${PORT:-8000}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      AGENT_API_KEY: "${AGENT_API_KEY:-dev-key}"
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_PER_MINUTE: "${RATE_LIMIT_PER_MINUTE:-10}"
      DAILY_BUDGET_USD: "${DAILY_BUDGET_USD:-1.0}"
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
